name: Validate LaneCoach
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lanecoach
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: lanecoach_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lanecoach -d lanecoach_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://lanecoach:ci-test-only@localhost:5432/lanecoach_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ../backend/requirements.txt
      - run: python ../scripts/verify_public_demo.py
